<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>瑜珈教練代課系統</title>
  
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- 載入 Babel -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    .animate-in.fade-in { animation: fadeIn 0.3s ease-out forwards; }
    .animate-in.slide-in-from-bottom-4 { animation: slideUp 0.4s ease-out forwards; }
    .animate-in.slide-in-from-top-4 { animation: slideDown 0.3s ease-out forwards; }
    .animate-in.zoom-in-95 { animation: zoomIn 0.2s ease-out forwards; }
    .animate-spin { animation: spin 1s linear infinite; }
  </style>
</head>
<body class="bg-gradient-to-br from-pink-50 to-purple-50 text-gray-800 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // 1. 內建 Icon 元件庫 (SVG)
    // ==========================================
    const LucideIcon = ({ name, size = 24, color = 'currentColor', fill = 'none', className = '' }) => {
      const paths = {
        Home: <><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>,
        PlusCircle: <><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></>,
        User: <><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
        MapPin: <><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></>,
        Clock: <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
        Calendar: <><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>,
        ChevronLeft: <polyline points="15 18 9 12 15 6"/>,
        Star: <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>,
        MessageCircle: <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>,
        Send: <><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></>,
        Trash2: <><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>,
        CheckCircle2: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>,
        XCircle: <><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></>,
        AlertCircle: <><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>,
        GripVertical: <><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></>,
        Edit2: <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>,
        Flame: <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>,
        TrendingUp: <><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>,
        Wallet: <><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></>,
        Award: <><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></>,
        Loader2: <><path d="M21 12a9 9 0 1 1-6.219-8.56"/></>,
        Save: <><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></>
      };
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {paths[name] || <circle cx="12" cy="12" r="10"/>}
        </svg>
      );
    };

    // ==========================================
    // 2. 初始測試資料 (Seeding Data)
    // ==========================================
    const MOCK_USERS = [
      { id: 'u1', name: '艾莉絲 (Alice)', avatar: 'https://i.pravatar.cc/150?u=u1', bio: '專職於空中瑜珈與皮拉提斯，曾於成吉思汗、dw yoga 擔任約聘教練。教學風格溫和，注重學員核心發力與安全。', skills: ['空中瑜珈', '皮拉提斯', '瑜珈輪'], bank_account: '台新(812) 2888-1234-5678' },
      { id: 'u2', name: '鮑伯 (Bob)', avatar: 'https://i.pravatar.cc/150?u=u2', bio: '熱愛高強度間歇與 Zumba，帶動氣氛能力極佳。證照：ACE-CPT, Zumba Basic 1。', skills: ['Zumba', '肌力訓練', 'TRX'], bank_account: '國泰(013) 0000-9876-5432' },
      { id: 'u3', name: '克洛伊 (Chloe)', avatar: 'https://i.pravatar.cc/150?u=u3', bio: '十年瑜珈教學經驗，擅長陰瑜珈、流瑜珈。', skills: ['流瑜珈', '陰瑜珈'], bank_account: '玉山(808) 1111-2222-3333' }
    ];

    const INITIAL_CLASSES = [
      { id: 'c1', requester_id: 'u1', course_name: '基礎空中環', location: 'DW Yoga 忠孝館', class_date: new Date(Date.now() + 86400000 * 2).toISOString().split('T')[0], start_time: '14:00', end_time: '15:00', fee: 800, status: 'OPEN', payment_status: 'UNPAID' },
      { id: 'c2', requester_id: 'u3', course_name: '熱力 Zumba', location: '成吉思汗 信義店', class_date: new Date(Date.now() - 86400000).toISOString().split('T')[0], start_time: '18:30', end_time: '19:30', fee: 1000, status: 'COMPLETED', payment_status: 'PAID_BY_A' }
    ];

    const INITIAL_APPLICATIONS = [
      { id: 'a1', class_id: 'c1', applicant_id: 'u2', status: 'PENDING', waitlist_order: null },
      { id: 'a3', class_id: 'c2', applicant_id: 'u2', status: 'ACCEPTED', waitlist_order: null }
    ];

    const INITIAL_MESSAGES = [
      { id: 'm1', class_id: 'c1', sender_id: 'u2', content: '請問這堂課初學者多嗎？', is_deleted: false, timestamp: Date.now() - 3600000 },
      { id: 'm2', class_id: 'c1', sender_id: 'u1', content: '大部分是上過幾次的新手，不會太難！', is_deleted: false, timestamp: Date.now() - 3500000 }
    ];

    const INITIAL_REVIEWS = [
      { id: 'r1', class_id: 'c2', reviewer_id: 'u3', reviewee_id: 'u2', rating: 5, tags: ['準時', '學生反應極佳'], comment: 'Bob老師超會帶氣氛！' }
    ];

    // ==========================================
    // 3. 系統輔助函數
    // ==========================================
    const getTodayStr = () => new Date().toISOString().split('T')[0];

    const getUserRating = (userId, allReviews) => {
      const userReviews = allReviews.filter(r => r.reviewee_id === userId);
      if (userReviews.length === 0) return "5.0"; 
      const sum = userReviews.reduce((acc, r) => acc + r.rating, 0);
      return (sum / userReviews.length).toFixed(1);
    };

    const isUrgent = (dateStr, timeStr) => {
      const classDateTime = new Date(`${dateStr}T${timeStr}`);
      const diffHours = (classDateTime - new Date()) / (1000 * 60 * 60);
      return diffHours > 0 && diffHours <= 48;
    };

    const getStatusLabel = (cls) => {
      if (cls.status === 'COMPLETED') {
        if (cls.payment_status === 'RECEIVED_BY_B') return { text: '已結清', style: 'bg-indigo-100 text-indigo-700' };
        if (cls.payment_status === 'PAID_BY_A') return { text: '已匯款', style: 'bg-green-100 text-green-700' };
        return { text: '已結案', style: 'bg-gray-100 text-gray-600' };
      }
      if (cls.status === 'MATCHED') return { text: '待上課', style: 'bg-teal-100 text-teal-700' };
      return { text: '徵求中', style: 'bg-pink-100 text-pink-600' };
    };

    // ==========================================
    // 4. 核心系統元件 (App)
    // ==========================================
    function App() {
      const [users, setUsers] = useState([]);
      const [classes, setClasses] = useState([]);
      const [applications, setApplications] = useState([]);
      const [messages, setMessages] = useState([]);
      const [reviews, setReviews] = useState([]);
      
      const [currentUserId, setCurrentUserId] = useState('u1');
      const [currentView, setCurrentView] = useState('BOARD'); 
      const [selectedClassId, setSelectedClassId] = useState(null);
      const [toast, setToast] = useState(null);
      const [confirmDialog, setConfirmDialog] = useState(null);
      
      const [isInitializing, setIsInitializing] = useState(true);
      const [isCloud, setIsCloud] = useState(false);
      const [dbActions, setDbActions] = useState(null);
      const dbInstance = useRef(null);

      // --- 智慧降級機制 (Firebase or LocalStorage) ---
      useEffect(() => {
        let unsubscribes = [];
        
        // 【1. 如果您未來申請了 Firebase，請把設定貼入下方物件中】
        const myFirebaseConfig = = {
            apiKey: "AIzaSyCARgXIaT6tPJrHI91M65u7IclViaWwuBk",
            authDomain: "find-teacher-1a48a.firebaseapp.com",
            projectId: "find-teacher-1a48a",
            storageBucket: "find-teacher-1a48a.firebasestorage.app",
            messagingSenderId: "1033655544639",
            appId: "1:1033655544639:web:3cce2d4b5bce713a5f418a",
            measurementId: "G-RNHN2BZP0V"
          };
        const initDB = async () => {
          try {
            const injectedConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            const configToUse = injectedConfig || myFirebaseConfig;

            if (configToUse && Object.keys(configToUse).length > 0) {
              // 雲端模式 (Firebase)
              const { initializeApp } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js');
              const { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js');
              const { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, deleteDoc } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
              
              const appId = typeof __app_id !== 'undefined' ? __app_id : 'yoga-sub-app-123';
              const app = initializeApp(configToUse);
              const auth = getAuth(app);
              const db = getFirestore(app);
              dbInstance.current = { db, collection, doc, setDoc, updateDoc, deleteDoc, appId };

              const getDocRef = (colName, docId) => doc(db, 'artifacts', appId, 'public', 'data', colName, docId);
              
              setDbActions({
                addClass: async (data) => await setDoc(getDocRef('classes', data.id), data),
                updateClass: async (id, data) => await updateDoc(getDocRef('classes', id), data),
                deleteClass: async (id) => await deleteDoc(getDocRef('classes', id)),
                addApp: async (data) => await setDoc(getDocRef('applications', data.id), data),
                updateApp: async (id, data) => await updateDoc(getDocRef('applications', id), data),
                addMsg: async (data) => await setDoc(getDocRef('messages', data.id), data),
                updateMessage: async (id, data) => await updateDoc(getDocRef('messages', id), data),
                addReview: async (data) => await setDoc(getDocRef('reviews', data.id), data),
                updateUser: async (id, data) => await updateDoc(getDocRef('users', id), data)
              });

              // 驗證
              const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
              if (token) await signInWithCustomToken(auth, token);
              else await signInAnonymously(auth);

              onAuthStateChanged(auth, (user) => {
                if (user) {
                  const getColRef = (colName) => collection(db, 'artifacts', appId, 'public', 'data', colName);
                  unsubscribes.push(onSnapshot(getColRef('users'), (snap) => {
                    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (data.length === 0) MOCK_USERS.forEach(u => setDoc(getDocRef('users', u.id), u));
                    else { setUsers(data); setIsCloud(true); setIsInitializing(false); }
                  }, (err) => { console.error(err); initLocalStorageMode(); }));
                  unsubscribes.push(onSnapshot(getColRef('classes'), (snap) => {
                    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (data.length === 0) INITIAL_CLASSES.forEach(c => setDoc(getDocRef('classes', c.id), c));
                    else setClasses(data);
                  }));
                  unsubscribes.push(onSnapshot(getColRef('applications'), (snap) => {
                    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (data.length === 0) INITIAL_APPLICATIONS.forEach(a => setDoc(getDocRef('applications', a.id), a));
                    else setApplications(data);
                  }));
                  unsubscribes.push(onSnapshot(getColRef('messages'), (snap) => setMessages(snap.docs.map(d => ({ id: d.id, ...d.data() })))));
                  unsubscribes.push(onSnapshot(getColRef('reviews'), (snap) => {
                    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (data.length === 0) INITIAL_REVIEWS.forEach(r => setDoc(getDocRef('reviews', r.id), r));
                    else setReviews(data);
                  }));
                }
              });
            } else {
              initLocalStorageMode(); // 無 Firebase Config，觸發本地模式
            }
          } catch (err) {
            console.error("Firebase init failed, switching to LocalStorage mode:", err);
            initLocalStorageMode();
          }
        };
        
        initDB();
        return () => unsubscribes.forEach(unsub => unsub());
      }, []);

      const initLocalStorageMode = () => {
        const load = (key, initialData) => {
          const stored = localStorage.getItem('yoga_app_' + key);
          if (stored) return JSON.parse(stored);
          localStorage.setItem('yoga_app_' + key, JSON.stringify(initialData));
          return initialData;
        };

        setUsers(load('users', MOCK_USERS));
        setClasses(load('classes', INITIAL_CLASSES));
        setApplications(load('applications', INITIAL_APPLICATIONS));
        setMessages(load('messages', INITIAL_MESSAGES));
        setReviews(load('reviews', INITIAL_REVIEWS));

        const save = (key, data) => localStorage.setItem('yoga_app_' + key, JSON.stringify(data));

        setDbActions({
          addClass: async (data) => { setClasses(p => { const n = [...p, data]; save('classes', n); return n; }); },
          updateClass: async (id, data) => { setClasses(p => { const n = p.map(c => c.id === id ? { ...c, ...data } : c); save('classes', n); return n; }); },
          deleteClass: async (id) => { setClasses(p => { const n = p.filter(c => c.id !== id); save('classes', n); return n; }); },
          addApp: async (data) => { setApplications(p => { const n = [...p, data]; save('applications', n); return n; }); },
          updateApp: async (id, data) => { setApplications(p => { const n = p.map(a => a.id === id ? { ...a, ...data } : a); save('applications', n); return n; }); },
          addMsg: async (data) => { setMessages(p => { const n = [...p, data]; save('messages', n); return n; }); },
          updateMessage: async (id, data) => { setMessages(p => { const n = p.map(m => m.id === id ? { ...m, ...data } : m); save('messages', n); return n; }); },
          addReview: async (data) => { setReviews(p => { const n = [...p, data]; save('reviews', n); return n; }); },
          updateUser: async (id, data) => { setUsers(p => { const n = p.map(u => u.id === id ? { ...u, ...data } : u); save('users', n); return n; }); }
        });
        
        setIsCloud(false);
        setIsInitializing(false);
      };

      if (isInitializing) {
        return (
          <div className="h-screen w-full flex flex-col items-center justify-center bg-pink-50">
            <LucideIcon name="Loader2" className="animate-spin text-pink-500 mb-4" size={48} />
            <p className="text-gray-500 font-medium animate-pulse">正在初始化系統資料...</p>
          </div>
        );
      }

      // 動態計算使用者的最新星級
      const computedUsers = users.map(u => ({
        ...u,
        avg_rating: Number(getUserRating(u.id, reviews)),
        review_count: reviews.filter(r => r.reviewee_id === u.id).length
      }));
      const currentUser = computedUsers.find(u => u.id === currentUserId) || computedUsers[0];

      return (
        <div className="pb-20 md:pb-0 md:pl-20">
          <header className="sticky top-0 z-40 bg-white/70 backdrop-blur-md shadow-sm px-4 py-3 flex justify-between items-center">
            <div className="flex items-center gap-2">
              <h1 className="text-lg font-bold bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent">YogaSubstitute</h1>
              <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${isCloud ? 'bg-blue-100 text-blue-700' : 'bg-yellow-100 text-yellow-700'}`}>
                {isCloud ? 'Cloud Sync 🟢' : 'Local Mode 🟡'}
              </span>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-xs text-gray-500">測試身分:</span>
              <select 
                className="text-sm bg-pink-100 text-pink-800 border-none rounded-full px-3 py-1 font-medium focus:ring-2 focus:ring-pink-300 outline-none cursor-pointer"
                value={currentUserId}
                onChange={(e) => { setCurrentUserId(e.target.value); navigateTo('BOARD'); }}
              >
                {computedUsers.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
              </select>
            </div>
          </header>

          <main className="max-w-2xl mx-auto p-4">
            {currentView === 'BOARD' && <BoardView classes={classes} users={computedUsers} onViewDetail={(id) => navigateTo('DETAIL', id)} currentUser={currentUser} />}
            {currentView === 'CREATE' && <CreateRequestView onPublish={async (newClass) => { await dbActions.addClass(newClass); navigateTo('BOARD'); }} currentUser={currentUser} />}
            {currentView === 'PROFILE' && <ProfileView currentUser={currentUser} classes={classes} applications={applications} reviews={reviews} users={computedUsers} onViewDetail={(id) => navigateTo('DETAIL', id)} onEditProfile={() => navigateTo('EDIT_PROFILE')} />}
            {currentView === 'EDIT_PROFILE' && <EditProfileView currentUser={currentUser} onSave={async (updatedUser) => { await dbActions.updateUser(updatedUser.id, updatedUser); navigateTo('PROFILE'); showToast("資料已更新！"); }} onCancel={() => navigateTo('PROFILE')} />}
            {currentView === 'DETAIL' && <ClassDetailView classId={selectedClassId} classes={classes} applications={applications} messages={messages} reviews={reviews} users={computedUsers} currentUser={currentUser} onBack={() => navigateTo('BOARD')} showToast={showToast} showConfirm={showConfirm} dbActions={dbActions} />}
          </main>

          {toast && (
            <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 animate-in slide-in-from-top-4 fade-in duration-300">
              <div className={`flex items-center gap-2 px-5 py-3 rounded-full shadow-[0_8px_30px_rgb(0,0,0,0.12)] border ${toast.type === 'success' ? 'bg-green-50 border-green-200 text-green-800' : 'bg-red-50 border-red-200 text-red-800'}`}>
                {toast.type === 'success' ? <LucideIcon name="CheckCircle2" size={18} /> : <LucideIcon name="AlertCircle" size={18} />}
                <span className="font-bold text-sm whitespace-nowrap">{toast.msg}</span>
              </div>
            </div>
          )}

          {confirmDialog && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm animate-in fade-in">
              <div className="bg-white rounded-3xl p-6 w-full max-w-xs shadow-xl animate-in zoom-in-95 duration-200 text-center">
                <div className="w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4"><LucideIcon name="AlertCircle" size={32} /></div>
                <h3 className="text-lg font-bold text-gray-800 mb-2">確認操作</h3>
                <p className="text-sm text-gray-600 mb-6">{confirmDialog.msg}</p>
                <div className="flex gap-3">
                  <button onClick={() => setConfirmDialog(null)} className="flex-1 py-3 text-gray-600 font-bold rounded-xl bg-gray-100 active:scale-95 transition-transform">取消</button>
                  <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog(null); }} className="flex-1 py-3 text-white font-bold rounded-xl bg-red-500 active:scale-95 transition-transform">確定執行</button>
                </div>
              </div>
            </div>

    function ClassDetailView({ classId, classes, applications, messages, reviews, users, currentUser, onBack, showToast, showConfirm, dbActions }) {
      const cls = classes.find(c => c.id === classId);
      const requester = users.find(u => u.id === cls?.requester_id);
      const isRequester = currentUser.id === cls?.requester_id;
      const myApp = applications.find(a => a.class_id === classId && a.applicant_id === currentUser.id);
      const classApps = applications.filter(a => a.class_id === classId);
      
      const [selectedApp, setSelectedApp] = useState(null);
      const [showReviewForm, setShowReviewForm] = useState(false);
      const [reviewData, setReviewData] = useState({ rating: 5, comment: '', tags: [] });
      const [chatInput, setChatInput] = useState('');
      const [sortMode, setSortMode] = useState(false);
      const [isEditingClass, setIsEditingClass] = useState(false);
      const [editFormData, setEditFormData] = useState({ ...cls });

      if (!cls) return <div>找不到課程</div>;
      const isClassPast = new Date(cls.class_date) < new Date(getTodayStr());
      
      const handleApply = () => {
        showConfirm("確定要應徵這堂代課嗎？", async () => {
          await dbActions.addApp({ id: 'a' + Date.now(), class_id: classId, applicant_id: currentUser.id, status: 'PENDING', waitlist_order: null });
          showToast("應徵成功！");
        });
      };

      const handleCancelApp = () => {
        showConfirm("確定要取消應徵/代課嗎？", async () => {
          await dbActions.updateApp(myApp.id, { status: 'CANCELLED' });
          if (myApp.status === 'ACCEPTED') {
            await dbActions.updateClass(classId, { status: 'OPEN' });
            showToast("已取消。系統將自動遞補候補！", "error");
          } else showToast("已取消您的應徵申請。");
        });
      };

      const handleAppStatusChange = async (appId, newStatus) => {
        if (newStatus === 'ACCEPTED') {
          await dbActions.updateApp(appId, { status: 'ACCEPTED', waitlist_order: null });
          await dbActions.updateClass(classId, { status: 'MATCHED' });
          showToast("已確認正取代課者！");
        } else if (newStatus === 'WAITLISTED') {
          const currentMax = Math.max(0, ...applications.filter(a2 => a2.class_id === classId && a2.status === 'WAITLISTED').map(a2 => a2.waitlist_order || 0));
          await dbActions.updateApp(appId, { status: 'WAITLISTED', waitlist_order: currentMax + 1 });
        } else {
          await dbActions.updateApp(appId, { status: newStatus, waitlist_order: null });
        }
        setSelectedApp(null);
      };

      const moveWaitlist = async (appId, direction) => {
        const wlApps = [...applications].filter(a => a.class_id === classId && a.status === 'WAITLISTED').sort((a,b) => a.waitlist_order - b.waitlist_order);
        const idx = wlApps.findIndex(a => a.id === appId);
        if (idx < 0) return;
        let swapIdx = direction === 'UP' ? idx - 1 : idx + 1;
        if (swapIdx >= 0 && swapIdx < wlApps.length) {
          await dbActions.updateApp(wlApps[idx].id, { waitlist_order: wlApps[swapIdx].waitlist_order });
          await dbActions.updateApp(wlApps[swapIdx].id, { waitlist_order: wlApps[idx].waitlist_order });
        }
      };

      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;
        await dbActions.addMsg({ id: 'm' + Date.now(), class_id: classId, sender_id: currentUser.id, content: chatInput.trim(), is_deleted: false, timestamp: Date.now() });
        setChatInput('');
      };

      const togglePayment = async (type) => {
        if (type === 'PAID_BY_A' && isRequester) await dbActions.updateClass(classId, { payment_status: cls.payment_status === 'UNPAID' ? 'PAID_BY_A' : 'UNPAID' });
        else if (type === 'RECEIVED_BY_B' && !isRequester) await dbActions.updateClass(classId, { payment_status: cls.payment_status === 'PAID_BY_A' ? 'RECEIVED_BY_B' : 'PAID_BY_A' });
      };

      const submitReview = async () => {
        const acceptedApp = classApps.find(a => a.status === 'ACCEPTED');
        if (!acceptedApp) return;

              <div className="grid grid-cols-2 gap-3">

                <div><label className="block text-xs font-medium text-gray-500 mb-1">開始</label><input required type="time" className="w-full bg-gray-50 border border-gray-100 px-4 py-2 rounded-xl text-sm" value={editFormData.start_time} onChange={e => setEditFormData({...editFormData, start_time: e.target.value})} /></div>
                <div><label className="block text-xs font-medium text-gray-500 mb-1">結束</label><input required type="time" className="w-full bg-gray-50 border border-gray-100 px-4 py-2 rounded-xl text-sm" value={editFormData.end_time} onChange={e => setEditFormData({...editFormData, end_time: e.target.value})} /></div>
              </div>
              <div><label className="block text-xs font-medium text-gray-500 mb-1">費用 (NT$)</label><input required type="number" step="100" className="w-full bg-gray-50 border border-gray-100 px-4 py-2 rounded-xl text-sm" value={editFormData.fee} onChange={e => setEditFormData({...editFormData, fee: Number(e.target.value)})} /></div>
              <button type="submit" className="w-full bg-pink-500 text-white font-bold py-3 rounded-xl mt-2 flex items-center justify-center gap-2"><LucideIcon name="Save" size={18}/> 儲存修改</button>
            </form>
          ) : (
            <div className="bg-white rounded-3xl p-6 shadow-sm border border-pink-50 mb-6 relative overflow-hidden">
              {cls.status === 'COMPLETED' && <div className="absolute top-0 right-0 bg-gray-500 text-white text-xs px-4 py-1.5 rounded-bl-xl font-bold">{getStatusLabel(cls).text}</div>}
              {cls.status === 'MATCHED' && <div className="absolute top-0 right-0 bg-green-500 text-white text-xs px-4 py-1.5 rounded-bl-xl font-bold">待上課</div>}
              {cls.status === 'OPEN' && isUrgent(cls.class_date, cls.start_time) && <div className="absolute top-0 right-0 bg-red-500 text-white text-xs px-4 py-1.5 rounded-bl-xl font-bold flex items-center gap-1"><LucideIcon name="Flame" size={14}/>急件</div>}

                <h2 className="text-2xl font-bold text-gray-800 mb-1">{cls.course_name}</h2>

                    <button onClick={() => setIsEditingClass(true)} className="p-2 text-gray-400 hover:text-indigo-500 hover:bg-indigo-50 rounded-full transition-colors"><LucideIcon name="Edit2" size={18}/></button>

                  </div>

              <div className="bg-pink-50/50 rounded-2xl p-4 space-y-2 mb-4">

                <div className="flex items-center gap-2 text-sm text-gray-700"><LucideIcon name="Clock" size={16} className="text-purple-400" /> {cls.start_time} - {cls.end_time}</div>
                <div className="flex items-center gap-2 text-sm text-gray-700"><LucideIcon name="MapPin" size={16} className="text-rose-400" /> {cls.location}</div>
                <div className="font-bold text-pink-600 text-lg mt-2">NT$ {cls.fee}</div>

                        {sortMode && app.status === 'WAITLISTED' && (
                          <div className="flex flex-col gap-1 mr-1">
                            <button onClick={(e)=>{e.stopPropagation(); moveWaitlist(app.id, 'UP')}} className="text-gray-400 hover:text-pink-500">▲</button>
                            <button onClick={(e)=>{e.stopPropagation(); moveWaitlist(app.id, 'DOWN')}} className="text-gray-400 hover:text-pink-500">▼</button>
                          </div>
                        )}
                        <img src={user?.avatar} alt="u" className="w-10 h-10 rounded-full object-cover" />
                        <div><div className="font-bold text-gray-800 text-sm flex items-center gap-1">{user?.name} <LucideIcon name="Star" size={12} className="text-yellow-400 fill-current"/>{user?.avg_rating}</div><div className="text-xs text-gray-500">{app.status === 'WAITLISTED' ? <span className="text-yellow-600 font-medium">候補 {app.waitlist_order}</span> : '新應徵'}</div></div>
                      </div>
                      {!sortMode && <button className="bg-pink-50 text-pink-600 text-xs px-3 py-1 rounded-full font-medium">審核</button>}
                    </div>
                  )
                })}
                {classApps.filter(a => a.status === 'REJECTED' || a.status === 'CANCELLED').map(app => {

                  return (
                    <div key={app.id} className="bg-gray-50 rounded-2xl p-3 flex items-center justify-between border border-gray-100 opacity-60">
                       <div className="flex items-center gap-3"><img src={user?.avatar} alt="u" className="w-10 h-10 rounded-full grayscale object-cover" /><div><div className="font-bold text-gray-600 text-sm">{user?.name}</div><div className="text-xs text-gray-400">{app.status === 'CANCELLED' ? '已取消' : '婉拒'}</div></div></div>
                    </div>
                  )
                })}
              </div>
            </div>
          )}

          {(cls.status === 'COMPLETED' || isClassPast) && (acceptedApp || cls.status === 'COMPLETED') && (isRequester || (myApp && myApp.status === 'ACCEPTED')) && (
            <div className="mb-6 animate-in fade-in zoom-in">
              <div className="bg-gradient-to-br from-indigo-50 to-blue-50 rounded-3xl p-5 border border-blue-100 shadow-sm">
                <h3 className="text-lg font-bold text-indigo-900 mb-3 flex items-center gap-2"><LucideIcon name="CheckCircle2" size={18}/> 結案與對帳面板</h3>
                <div className="bg-white rounded-xl p-4 mb-4 text-sm">
                  <div className="font-bold text-gray-700 mb-1">隱私資訊解鎖</div>
                  {isRequester ? <p className="text-gray-600">代課者收款帳號: <br/><span className="font-mono text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded mt-1 inline-block">{users.find(u=>u.id===acceptedApp?.applicant_id)?.bank_account}</span></p> : <p className="text-gray-600">您的收款帳號已提供給發案者核對。</p>}
                </div>
                <div className="space-y-3">
                  <label className={`flex items-center gap-3 p-3 rounded-xl border ${cls.payment_status !== 'UNPAID' ? 'bg-green-50 border-green-200 text-green-800' : 'bg-white border-gray-200'} ${!isRequester && 'opacity-60 cursor-not-allowed'}`}>
                    <input type="checkbox" className="w-5 h-5 accent-green-600" checked={cls.payment_status !== 'UNPAID'} onChange={() => togglePayment('PAID_BY_A')} disabled={!isRequester} />
                    <span className="font-medium text-sm">發案者已匯款 (A視角) {cls.payment_status !== 'UNPAID' && <LucideIcon name="CheckCircle2" size={16} className="inline ml-1 text-green-600"/>}</span>
                  </label>
                  <label className={`flex items-center gap-3 p-3 rounded-xl border ${cls.payment_status === 'RECEIVED_BY_B' ? 'bg-green-50 border-green-200 text-green-800' : 'bg-white border-gray-200'} ${isRequester && 'opacity-60 cursor-not-allowed'}`}>
                    <input type="checkbox" className="w-5 h-5 accent-green-600" checked={cls.payment_status === 'RECEIVED_BY_B'} onChange={() => togglePayment('RECEIVED_BY_B')} disabled={isRequester} />
                    <span className="font-medium text-sm">代課者已收款 (B視角) {cls.payment_status === 'RECEIVED_BY_B' && <LucideIcon name="CheckCircle2" size={16} className="inline ml-1 text-green-600"/>}</span>
                  </label>
                </div>
                {isRequester && cls.status === 'COMPLETED' && !reviews.find(r => r.class_id === classId) && (
                  <div className="mt-5 p-5 bg-gradient-to-r from-yellow-50 to-orange-50 rounded-2xl border border-yellow-200 text-center animate-in zoom-in">
                    <h4 className="font-bold text-yellow-800 mb-2">代課已完成！</h4>
                    <p className="text-xs text-yellow-700 mb-4">請為這次的代課老師留下評價，您的反饋將會動態更新至他的公開個人履歷中。</p>
                    <button onClick={() => setShowReviewForm(true)} className="w-full bg-gradient-to-r from-yellow-400 to-orange-400 text-white font-bold py-3.5 rounded-xl shadow-md flex items-center justify-center gap-2 hover:scale-[1.02] transition-transform">
                      <LucideIcon name="Star" size={18} fill="currentColor"/> 給予代課老師反饋
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {(isRequester || myApp) && (
            <div className="bg-white rounded-3xl p-5 shadow-sm border border-pink-50 mb-10">
              <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"><LucideIcon name="MessageCircle" size={18}/> 任務專屬留言板</h3>
              <div className="space-y-4 mb-4 max-h-64 overflow-y-auto pr-2">
                {messages.filter(m => m.class_id === classId).length === 0 && <div className="text-center text-sm text-gray-400 py-4">尚無留言</div>}
                {messages.filter(m => m.class_id === classId).sort((a,b)=>a.timestamp-b.timestamp).map(msg => {
                  const isMe = msg.sender_id === currentUser.id;
                  const sender = users.find(u => u.id === msg.sender_id);
                  if (msg.is_deleted) return <div key={msg.id} className={`text-xs text-gray-400 italic ${isMe ? 'text-right' : 'text-left'}`}>訊息已刪除</div>;
                  return (
                    <div key={msg.id} className={`flex gap-2 ${isMe ? 'flex-row-reverse' : 'flex-row'}`}>
                      <img src={sender?.avatar} alt="u" className="w-8 h-8 rounded-full mt-1 object-cover" />
                      <div className={`group relative max-w-[75%] rounded-2xl px-4 py-2 ${isMe ? 'bg-pink-100 text-pink-900 rounded-tr-sm' : 'bg-gray-100 text-gray-800 rounded-tl-sm'}`}>
                        <div className="text-xs font-bold mb-0.5 opacity-50">{sender?.name}</div>
                        <div className="text-sm break-words">{msg.content}</div>
                        {isMe && <button onClick={() => dbActions.updateMessage(msg.id, { is_deleted: true })} className="absolute top-1/2 -translate-y-1/2 -left-8 text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><LucideIcon name="Trash2" size={16} /></button>}
                      </div>
                    </div>
                  )
                })}
              </div>
              <form onSubmit={handleSendMessage} className="flex gap-2">
                <input type="text" value={chatInput} onChange={e => setChatInput(e.target.value)} placeholder="留言溝通確認..." className="flex-1 bg-gray-50 border border-gray-100 rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-300"/>
                <button type="submit" className="bg-pink-500 text-white p-2 rounded-full hover:bg-pink-600 transition-colors shrink-0"><LucideIcon name="Send" size={18} className="ml-0.5" /></button>
              </form>
            </div>
          )}

          {showReviewForm && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm animate-in fade-in">
              <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-xl animate-in zoom-in-95 text-center">
                <h3 className="text-xl font-bold mb-4">評價代課老師</h3>
                <div className="flex justify-center gap-2 mb-4">
                  {[1,2,3,4,5].map(star => <button key={star} onClick={() => setReviewData({...reviewData, rating: star})}><LucideIcon name="Star" size={36} fill={star <= reviewData.rating ? '#FBBF24' : 'none'} className={star <= reviewData.rating ? 'text-yellow-400 transform scale-110 transition-transform' : 'text-gray-300 transition-transform'} /></button>)}
                </div>
                <div className="flex flex-wrap justify-center gap-2 mb-4">
                  {['準時到達', '學生反應極佳', '服裝專業', '熱心負責', '教學清晰'].map(tag => (
                    <button key={tag} onClick={() => toggleTag(tag)} className={`text-xs px-3 py-1.5 rounded-full font-medium transition-colors border ${reviewData.tags.includes(tag) ? 'bg-pink-100 border-pink-200 text-pink-700' : 'bg-gray-50 border-gray-200 text-gray-500 hover:bg-gray-100'}`}>#{tag}</button>
                  ))}
                </div>

                <div className="flex gap-2">
                  <button onClick={() => setShowReviewForm(false)} className="flex-1 py-3 text-gray-500 font-bold rounded-xl bg-gray-100">稍後再評</button>
                  <button onClick={submitReview} className="flex-1 py-3 text-white font-bold rounded-xl bg-gradient-to-r from-pink-500 to-purple-500">送出評價</button>
                </div>
              </div>
            </div>
          )}

          <div className={`fixed inset-x-0 bottom-0 z-50 transition-transform duration-300 ease-out transform ${selectedApp ? 'translate-y-0' : 'translate-y-full'}`}>
            {selectedApp && <div className="fixed inset-0 bg-black/20 backdrop-blur-sm -z-10 h-screen" onClick={() => setSelectedApp(null)} />}
            <div className="bg-white rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.1)] p-6 max-h-[85vh] overflow-y-auto">
              <div className="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-5" />
              {bottomSheetUser && (
                <>
                  <div className="flex justify-between items-start mb-6">
                    <div className="flex items-center gap-4">
                      <img src={bottomSheetUser.avatar} alt="av" className="w-16 h-16 rounded-full border-2 border-pink-100 object-cover" />
                      <div><h3 className="text-xl font-bold text-gray-800">{bottomSheetUser.name}</h3><div className="flex items-center gap-1 text-yellow-500 text-sm font-bold mt-1"><LucideIcon name="Star" size={14} fill="currentColor"/> {bottomSheetUser.avg_rating} <span className="text-xs text-gray-400 font-normal">({bottomSheetUser.review_count}則評價)</span></div></div>
                    </div>
                    <button onClick={() => setSelectedApp(null)} className="p-2 text-gray-400 bg-gray-100 rounded-full"><LucideIcon name="XCircle" size={20}/></button>
                  </div>
                  <div className="space-y-4 mb-8">
                    <div><h4 className="text-sm font-bold text-gray-500 mb-2">專長</h4><div className="flex flex-wrap gap-2">{bottomSheetUser.skills.map(s => <span key={s} className="bg-pink-50 text-pink-600 text-xs px-2.5 py-1 rounded-full">#{s}</span>)}</div></div>
                    <div><h4 className="text-sm font-bold text-gray-500 mb-2">教學經歷</h4><p className="text-sm text-gray-700 bg-gray-50 p-3 rounded-xl leading-relaxed">{bottomSheetUser.bio}</p></div>

                  {isRequester && selectedApp.status === 'PENDING' && (
                    <div className="grid grid-cols-3 gap-2">
                      <button onClick={() => handleAppStatusChange(selectedApp.id, 'ACCEPTED')} className="col-span-3 bg-gradient-to-r from-green-400 to-emerald-500 text-white font-bold py-3.5 rounded-xl mb-2 shadow-lg shadow-green-200">確認代課 (正取)</button>
                      <button onClick={() => handleAppStatusChange(selectedApp.id, 'WAITLISTED')} className="col-span-2 bg-yellow-100 text-yellow-700 font-bold py-3 rounded-xl">設為候補</button>
                      <button onClick={() => handleAppStatusChange(selectedApp.id, 'REJECTED')} className="col-span-1 bg-gray-100 text-gray-500 font-bold py-3 rounded-xl">婉拒</button>
                    </div>
                  )}
                  {isRequester && selectedApp.status !== 'PENDING' && <div className="text-center font-bold text-gray-500 bg-gray-50 py-3 rounded-xl">當前狀態: {selectedApp.status === 'ACCEPTED' ? '正取' : selectedApp.status === 'WAITLISTED' ? '候補' : '已結案/婉拒'}</div>}
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    function EditProfileView({ currentUser, onSave, onCancel }) {
      const [formData, setFormData] = useState({ name: currentUser.name, avatar: currentUser.avatar, bio: currentUser.bio, skills: currentUser.skills.join(', '), bank_account: currentUser.bank_account || '' });
      const handleSubmit = (e) => { e.preventDefault(); onSave({ ...currentUser, name: formData.name, avatar: formData.avatar, bio: formData.bio, skills: formData.skills.split(',').map(s => s.trim()).filter(s => s), bank_account: formData.bank_account }); };

      return (
        <div className="animate-in slide-in-from-right-8 pb-10">
          <button onClick={onCancel} className="flex items-center gap-1 text-gray-500 mb-4 hover:text-pink-600 transition-colors"><LucideIcon name="ChevronLeft" size={20} /> 返回</button>
          <h2 className="text-2xl font-bold mb-6 text-gray-800 ml-2">編輯個人資料</h2>
          <form onSubmit={handleSubmit} className="bg-white rounded-3xl p-6 shadow-sm border border-pink-50 space-y-5">
            <div className="flex justify-center mb-4"><img src={formData.avatar} alt="預覽" className="w-20 h-20 rounded-full border-2 border-pink-100 object-cover shadow-sm" /></div>
            <div><label className="block text-sm font-medium text-gray-700 mb-1">姓名 / 暱稱</label><input required type="text" className="w-full bg-gray-50 border border-gray-100 px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} /></div>
            <div><label className="block text-sm font-medium text-gray-700 mb-1">大頭貼網址</label><input required type="url" className="w-full bg-gray-50 border border-gray-100 px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300" value={formData.avatar} onChange={e => setFormData({...formData, avatar: e.target.value})} /></div>
            <div><label className="block text-sm font-medium text-gray-700 mb-1">專長標籤 (請以逗號分隔)</label><input type="text" className="w-full bg-gray-50 border border-gray-100 px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300" value={formData.skills} onChange={e => setFormData({...formData, skills: e.target.value})} placeholder="例如: 空中瑜珈, 皮拉提斯" /></div>
            <div><label className="block text-sm font-medium text-gray-700 mb-1">收款銀行帳號</label><input type="text" className="w-full bg-gray-50 border border-gray-100 px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300" value={formData.bank_account} onChange={e => setFormData({...formData, bank_account: e.target.value})} placeholder="例如: 台新(812) 2888-1234-5678" /></div>
            <div><label className="block text-sm font-medium text-gray-700 mb-1">教學經歷與簡介</label><textarea required className="w-full bg-gray-50 border border-gray-100 px-4 py-3 rounded-xl h-32 focus:outline-none focus:ring-2 focus:ring-pink-300" value={formData.bio} onChange={e => setFormData({...formData, bio: e.target.value})} /></div>
            <button type="submit" className="w-full bg-gradient-to-r from-pink-400 to-purple-500 text-white font-bold text-lg py-3.5 rounded-xl mt-4 shadow-lg shadow-pink-200 active:scale-95 transition-transform">儲存資料</button>
          </form>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
